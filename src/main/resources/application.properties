spring.application.name=order-management

spring.datasource.url=jdbc:postgresql://localhost:5432/order_management?options=-c%20timezone=Asia/Kolkata
spring.datasource.username=oms_user
spring.datasource.password=local_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Log SQL generated by Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log SQL and bound parameter values
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Local development only — replace with a securely generated secret.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=order-management-api
app.security.jwt.expiration-minutes=15